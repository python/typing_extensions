repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: forbid-submodules
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: c883505f64b59c3c5c9375191e4ad9f98e727ccd  # frozen: v1.0.2
    hooks:
      - id: sphinx-lint
        args: [--enable=default-role]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc  # frozen: 0.38.2
    hooks:
      - id: check-renovate
        # Renovate needs an explicit language to update additional_dependencies.
        language: python
        additional_dependencies: ["json5==0.15.0"]
      - id: check-github-workflows
      - id: check-readthedocs
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3  # frozen: 0.26
    hooks:
      - id: validate-pyproject
        # Renovate needs an explicit language to update additional_dependencies.
        language: python
        additional_dependencies: ["validate-pyproject-schema-store[all]==2026.8.15"]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        # Renovate needs an explicit language to update additional_dependencies.
        language: golang
        additional_dependencies:
          # actionlint has a shellcheck integration which extracts shell scripts in `run:` steps from GitHub Actions
          # and checks these with shellcheck. This is arguably its most useful feature,
          # but the integration only works if shellcheck is installed
          - "github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1"
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
  - repo: meta
    hooks:
      - id: check-hooks-apply

ci:
  autoupdate_schedule: quarterly
